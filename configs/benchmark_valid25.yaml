experiment: acdlr_vs_cnn_valid25
dataset_dir: data/LU3M6TGT_yolo_format
split: valid
max_images: 25
visual_count: 8
matching:
  center_tolerance: 1.34
  radius_tolerance: 1.0
acdlr:
  min_radius: 4
  max_radius: 70
  canny_threshold: 45
  strictness: 16
cnn:
  weights: artifacts/crater_cnn_yolo_train/moon_small/weights/best.pt
  imgsz: 416
  conf: 0.001
  iou: 0.15
  max_det: 150
outputs:
  report: artifacts/acdlr_vs_crater_cnn/comparison_report.md
  visual: artifacts/acdlr_vs_crater_cnn/visual_comparison.png
