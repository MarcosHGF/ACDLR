experiment: acdlr_vs_ellipse_rcnn_valid25
dataset_dir: data/LU3M6TGT_yolo_format
split: valid
max_images: 25
visual_count: 8
matching:
  center_tolerance: 1.34
  radius_tolerance: 1.0
acdlr:
  min_radius: 4
  max_radius: 70
  canny_threshold: 45
  strictness: 16
ellipse_rcnn:
  repository: external/ellipse-rcnn
  model: artifacts/ellipse_rcnn_pretrained/crater-rcnn
  score_threshold: 0.60
  max_detections: 150
  device: cpu
outputs:
  report: artifacts/acdlr_vs_ellipse_rcnn/comparison_report.md
  visual: artifacts/acdlr_vs_ellipse_rcnn/visual_comparison.png
  chart: artifacts/acdlr_vs_ellipse_rcnn/charts/acdlr_vs_ellipse_rcnn_metrics.png
