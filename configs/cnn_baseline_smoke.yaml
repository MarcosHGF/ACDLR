method: CNN YOLOv11 baseline
source_repository: https://github.com/sydney-machine-learning/crater-identification
purpose: Neural comparison baseline only. ACDLR remains classical image processing.
dataset_dir: data/LU3M6TGT_yolo_format
base_weights: external/crater-identification/YOLOv11model/yolo11n.pt
training:
  epochs: 1
  fraction: 0.02
  imgsz: 416
  batch: 8
  device: cpu
  workers: 0
inference:
  conf: 0.001
  iou: 0.15
  max_det: 150
output_weights: artifacts/crater_cnn_yolo_train/moon_small/weights/best.pt
