method: ACDLR
description: Classical image-processing crater detector defaults.
detector:
  tile_size: 1024
  overlap: 96
  clahe_clip: 2.5
  blur_ksize: 5
  min_radius: 4
  max_radius: 70
  canny_threshold: 45
  strictness: 16
risk:
  grid_rows: 3
  grid_cols: 3
  default_scale_m_per_px: 5.0
benchmark_matching:
  center_tolerance: 1.34
  radius_tolerance: 1.0
